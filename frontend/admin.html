<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | তৃপ্তি ফুড</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1050px;padding:50px 0}.admin-login,.admin-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.admin input{width:100%;min-width:120px;padding:11px;border:1px solid var(--line);border-radius:8px}.admin table{width:100%;border-collapse:collapse}.admin th,.admin td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.admin-scroll{overflow:auto}.admin .status{padding:4px 8px;border-radius:99px;background:#edf5f1;font-size:13px}</style></head><body><div class="topbar">তৃপ্তি ফুড নিরাপদ Admin</div><main class="admin wrap"><a href="index.html">← দোকানে ফিরুন</a><section class="admin-login" id="loginBox"><h1>Admin প্রবেশ</h1><p>Cloudflare secret হিসেবে সেট করা Admin token দিন। Token browser বন্ধ করলে মুছে যাবে।</p><form id="loginForm"><label>Admin token<input type="password" id="token" required autocomplete="current-password"></label><br><button class="button primary">প্রবেশ করুন</button><p id="loginMsg" role="status"></p></form></section><section class="admin-panel" id="panel" hidden><div class="admin-head"><div><p class="eyebrow">Dashboard</p><h1>অর্ডারসমূহ</h1></div><button class="button ghost" id="logout">বের হোন</button></div><div class="admin-scroll"><table><thead><tr><th>অর্ডার</th><th>ক্রেতা</th><th>মোট</th><th>পেমেন্ট</th><th>স্ট্যাটাস</th></tr></thead><tbody id="orders"></tbody></table></div><div class="admin-head" style="margin-top:45px"><div><p class="eyebrow">Catalogue</p><h1>পণ্য সম্পাদনা</h1></div></div><p>নাম, মূল্য ও stock পরিবর্তন করে “সংরক্ষণ” চাপুন।</p><div class="admin-scroll"><table><thead><tr><th>পণ্য</th><th>মূল্য (৳)</th><th>Stock</th><th></th></tr></thead><tbody id="products"></tbody></table></div><p id="productMsg" role="status"></p></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
